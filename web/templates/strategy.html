<!DOCTYPE html>
<html>
<head>
    <title>Crypto Trading Bot - {{ strategy_name|upper }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #00d4ff;
            font-size: 24px;
        }
        .back-btn {
            background: #2a2a4a;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #2a2a4a;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        .stat-positive {
            color: #00ff88;
        }
        .stat-negative {
            color: #ff4444;
        }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2a2a4a;
        }
        .chart-card h3 {
            margin-bottom: 15px;
            color: #888;
            font-size: 16px;
        }
        .grid-container {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2a4a;
        }
        .grid-levels {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
        .grid-level {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #0f0f1a;
            border-radius: 8px;
            border-left: 3px solid;
        }
        .grid-level.buy { border-left-color: #00ff88; }
        .grid-level.sell { border-left-color: #ff4444; }
        .grid-level.active_buy { border-left-color: #00ff88; background: #00ff8822; }
        .grid-level.active_sell { border-left-color: #ff4444; background: #ff444422; }
        .grid-level.neutral { border-left-color: #888; }
        .grid-price {
            font-weight: bold;
        }
        .grid-type {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .type-buy { background: #00ff8822; color: #00ff88; }
        .type-sell { background: #ff444422; color: #ff4444; }
        .type-active { background: #00d4ff22; color: #00d4ff; }
        .orders-table {
            background: #1a1a2e;
            border-radius: 12px;
            overflow-x: auto;
            margin-top: 20px;
        }
        .orders-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .orders-table th, .orders-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a4a;
        }
        .orders-table th {
            background: #0f0f1a;
            color: #888;
            font-weight: normal;
        }
        .filter-bar {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
        }
        button {
            background: #2a2a4a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-refresh {
            background: #28a745;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 {{ strategy_name|upper }} стратегія</h1>
        <a href="/" class="back-btn">← На головну</a>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading">Завантаження даних...</div>
        </div>
    </div>

    <script>
        const strategyName = '{{ strategy_name }}';

        async function loadStrategyData() {
            try {
                const response = await fetch(`/api/strategy_data/${strategyName}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('content').innerHTML = `<div class="loading">${data.error}</div>`;
                    return;
                }

                const status = data.status;
                const currentPrice = data.current_price;

                // Оновлюємо HTML
                document.getElementById('content').innerHTML = `
                    <!-- Статистика -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">$${status.balance?.toFixed(2) || 0}</div>
                            <div class="stat-label">Баланс (USDT)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value ${(status.total_pnl || 0) >= 0 ? 'stat-positive' : 'stat-negative'}">
                                $${status.total_pnl?.toFixed(2) || 0}
                            </div>
                            <div class="stat-label">Загальний PnL</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${status.active_buys || 0} / ${status.active_sells || 0}</div>
                            <div class="stat-label">Активні Buy/Sell</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${status.total_trades || 0}</div>
                            <div class="stat-label">Всього угод</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${status.win_rate || 0}%</div>
                            <div class="stat-label">Win Rate</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${status.symbol || '-'}</div>
                            <div class="stat-label">Торгова пара</div>
                        </div>
                    </div>

                    <!-- Графіки -->
                    <div class="charts-row">
                        <div class="chart-card">
                            <h3>📈 Капітал та PnL</h3>
                            <div id="pnlChart" style="height: 300px;"></div>
                        </div>
                        <div class="chart-card">
                            <h3>🏆 Win Rate</h3>
                            <div id="winRateChart" style="height: 300px;"></div>
                        </div>
                    </div>

                    <!-- Grid сітка -->
                    <div class="grid-container">
                        <h3>🎯 Grid сітка | Поточна ціна: <span style="color: #00d4ff;">$${currentPrice?.toFixed(2) || 0}</span></h3>
                        <div id="gridLevels" class="grid-levels">
                            <div class="loading">Завантаження рівнів...</div>
                        </div>
                    </div>

                    <!-- Ордери -->
                    <h3 style="margin-top: 20px;">📋 Історія ордерів</h3>
                    <div class="filter-bar">
                        <select id="orderSideFilter">
                            <option value="all">Всі сторони</option>
                            <option value="buy">Купівля</option>
                            <option value="sell">Продаж</option>
                        </select>
                        <select id="orderStatusFilter">
                            <option value="all">Всі статуси</option>
                            <option value="open">Відкриті</option>
                            <option value="closed">Закриті</option>
                        </select>
                        <input type="number" id="orderLimit" placeholder="Кількість" value="20">
                        <button onclick="loadOrders()">Застосувати</button>
                        <button class="btn-refresh" onclick="loadStrategyData()">🔄 Оновити</button>
                    </div>
                    <div class="orders-table" id="ordersTable">
                        <div class="loading">Завантаження...</div>
                    </div>
                `;

                // Малюємо графіки
                drawPnLChart(data.pnl_history);
                drawWinRateChart(status.winning_trades || 0, status.losing_trades || 0);

                // Завантажуємо grid рівні
                loadGridLevels();

                // Завантажуємо ордери
                loadOrders();

            } catch (e) {
                console.error('Помилка:', e);
                document.getElementById('content').innerHTML = `<div class="loading">Помилка завантаження даних</div>`;
            }
        }

        async function loadGridLevels() {
            try {
                const response = await fetch(`/api/grid_levels/${strategyName}`);
                const data = await response.json();

                if (data.error || !data.levels) {
                    document.getElementById('gridLevels').innerHTML = '<div class="loading">Немає даних сітки</div>';
                    return;
                }

                const container = document.getElementById('gridLevels');
                container.innerHTML = data.levels.map(level => `
                    <div class="grid-level ${level.type}">
                        <span class="grid-price">Рівень ${level.level}: $${level.price}</span>
                        <span class="grid-type type-${level.type === 'active_buy' || level.type === 'active_sell' ? 'active' : level.type}">
                            ${level.type === 'buy' ? '📈 BUY зона' :
                              level.type === 'sell' ? '📉 SELL зона' :
                              level.type === 'active_buy' ? '✅ Активний BUY ордер' :
                              level.type === 'active_sell' ? '🟡 Активний SELL ордер' : '⚪ Нейтральна зона'}
                        </span>
                    </div>
                `).join('');

            } catch (e) {
                console.error('Помилка завантаження grid:', e);
            }
        }

        function drawPnLChart(pnlHistory) {
            if (!pnlHistory || pnlHistory.length === 0) {
                document.getElementById('pnlChart').innerHTML = '<div class="loading">Немає даних PnL</div>';
                return;
            }

            const timestamps = pnlHistory.map(h => new Date(h.timestamp).toLocaleString());
            const pnlValues = pnlHistory.map(h => h.pnl);

            // Розраховуємо cumulative PnL
            let cumulative = 0;
            const cumulativePnl = pnlValues.map(p => cumulative += p);

            const trace1 = {
                x: timestamps,
                y: cumulativePnl,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Cumulative PnL',
                line: { color: '#00d4ff', width: 2 },
                marker: { size: 4 }
            };

            const layout = {
                paper_bgcolor: '#1a1a2e',
                plot_bgcolor: '#1a1a2e',
                font: { color: '#e0e0e0' },
                xaxis: { title: 'Час', gridcolor: '#2a2a4a' },
                yaxis: { title: 'PnL (USDT)', gridcolor: '#2a2a4a' }
            };

            Plotly.newPlot('pnlChart', [trace1], layout, { responsive: true });
        }

        function drawWinRateChart(wins, losses) {
            const data = [{
                values: [wins, losses],
                labels: [`Перемоги (${wins})`, `Поразки (${losses})`],
                type: 'pie',
                marker: { colors: ['#00ff88', '#ff4444'] },
                textinfo: 'label+percent',
                textposition: 'outside'
            }];

            const layout = {
                paper_bgcolor: '#1a1a2e',
                plot_bgcolor: '#1a1a2e',
                font: { color: '#e0e0e0' },
                showlegend: true,
                legend: { x: 0.5, y: -0.1, orientation: 'h' }
            };

            Plotly.newPlot('winRateChart', data, layout, { responsive: true });
        }

        async function loadOrders() {
            try {
                const side = document.getElementById('orderSideFilter')?.value || 'all';
                const status = document.getElementById('orderStatusFilter')?.value || 'all';
                const limit = document.getElementById('orderLimit')?.value || 20;

                const response = await fetch(`/api/orders?side=${side}&status=${status}&limit=${limit}&strategy=${strategyName}`);
                const orders = await response.json();

                const table = document.getElementById('ordersTable');
                if (!table) return;

                if (orders.length === 0) {
                    table.innerHTML = '<div class="loading">Немає ордерів</div>';
                    return;
                }

                table.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>Час</th><th>Сторона</th><th>Ціна</th><th>Кількість</th><th>Статус</th><th>PnL</th><th>Комісія</th></tr>
                        </thead>
                        <tbody>
                            ${orders.map(o => `
                                <tr>
                                    <td>${new Date(o.opened_at).toLocaleString()}</td>
                                    <td class="${o.side}">${o.side === 'buy' ? '📈 КУПІВЛЯ' : '📉 ПРОДАЖ'}</td>
                                    <td>$${parseFloat(o.price).toFixed(2)}</td>
                                    <td>${parseFloat(o.quantity).toFixed(6)}</td>
                                    <td>${o.status === 'open' ? '🟢 Відкрито' : '🔒 Закрито'}</td>
                                    <td class="${(o.pnl || 0) >= 0 ? 'stat-positive' : 'stat-negative'}">$${(o.pnl || 0).toFixed(2)}</td>
                                    <td>$${(o.commission || 0).toFixed(4)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

            } catch (e) {
                console.error('Помилка завантаження ордерів:', e);
            }
        }

        // Завантажуємо дані
        loadStrategyData();
        setInterval(loadStrategyData, 10000);
    </script>
</body>
</html>

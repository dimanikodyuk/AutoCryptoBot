[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot"
version = "0.1.0"
description = "Automated crypto trading bot for Bybit"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "python-telegram-bot>=20.7",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "apscheduler>=3.10.4",
    "requests>=2.31.0",
    "pybit>=5.6.0",
]

[project.scripts]
crypto-bot = "crypto_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]